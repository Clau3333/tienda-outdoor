<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ALBEDO Outdoor | Detalle de producto</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="admin.css"
    >

    <script src="vendedor-seguridad.js"></script>

</head>


<body>


    <div class="admin-layout">


        <!-- =========================================
             MENÚ
             ========================================= -->

        <aside class="admin-sidebar">


            <div class="admin-marca">

                <a href="index.html">

                    <img
                        src="img/logo-albedo.png"
                        alt="ALBEDO Outdoor"
                    >

                </a>

                <span>
                    VENDEDOR
                </span>

            </div>


            <nav
                class="admin-menu"
                aria-label="Menú del vendedor"
            >

                <a href="vendedor.html">
                    Inicio
                </a>

                <a
                    class="activo"
                    href="vendedor-productos.html"
                >
                    Productos
                </a>

                <a href="vendedor-ordenes.html">
                    Órdenes
                </a>

            </nav>


            <div class="admin-sidebar-inferior">

                <a
                    href="#"
                    id="cerrarSesionVendedor"
                >
                    ← Cerrar sesión
                </a>

            </div>


        </aside>



        <!-- =========================================
             CONTENIDO
             ========================================= -->

        <div class="admin-contenido">


            <header class="admin-cabecera">


                <div>

                    <p class="admin-etiqueta">
                        ALBEDO OUTDOOR
                    </p>

                    <h1>
                        Detalle del producto
                    </h1>

                </div>


                <div class="admin-usuario">

                    <span
                        class="admin-usuario-icono"
                        id="vendedorInicial"
                    >
                        V
                    </span>

                    <div>

                        <strong id="vendedorNombre">
                            Vendedor
                        </strong>

                        <small id="vendedorPerfil">
                            Vendedor
                        </small>

                    </div>

                </div>


            </header>



            <main>


                <section class="admin-bienvenida">

                    <p class="admin-etiqueta">
                        CONSULTA
                    </p>

                    <h2 id="detalleNombrePrincipal">
                        Producto
                    </h2>

                    <p>
                        Información completa del producto.
                        Esta vista es únicamente de consulta.
                    </p>

                </section>



                <section class="admin-seccion">


                    <div
                        class="admin-tarjeta"
                        id="detalleProductoVendedor"
                    >

                        <p class="text-secondary mb-0">
                            Cargando producto...
                        </p>

                    </div>


                </section>



                <div class="mt-4">

                    <a
                        href="vendedor-productos.html"
                        class="btn btn-outline-dark"
                    >
                        ← Volver a productos
                    </a>

                </div>


            </main>


        </div>


    </div>



    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    <script src="productos.js"></script>

    <script src="vendedor-producto-detalle.js"></script>


</body>

</html>
