<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ALBEDO Outdoor | Iniciar sesión</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Estilos ALBEDO -->

    <link
        rel="stylesheet"
        href="estilos.css"
    >

</head>


<body>


    <!-- =========================================
         CABECERA
         ========================================= -->

    <header class="cabecera-tienda">


        <div class="cabecera-superior">


            <div class="espacio-cabecera"></div>


            <a
                class="marca"
                href="index.html"
                aria-label="ALBEDO Outdoor, inicio"
            >

                <img
                    src="img/logo-albedo.png"
                    alt="ALBEDO Outdoor"
                >

            </a>


            <nav
                class="enlaces-principales"
                aria-label="Navegación principal"
            >

                <a href="index.html">
                    Inicio
                </a>

                <a href="productos.html">
                    Productos
                </a>

                <a href="contacto.html">
                    Contacto
                </a>

                <a href="carrito.html">
                    Carrito
                    <span class="carrito-contador" id="contadorCarrito">0</span>
                </a>

                <a
                    href="login.html"
                    aria-current="page"
                >
                    Iniciar sesión
                </a>

            </nav>


        </div>


    </header>



    <!-- =========================================
         CONTENIDO
         ========================================= -->

    <main>


        <section class="container py-5">


            <div class="row justify-content-center">


                <div class="col-12 col-lg-6 col-xl-5">


                    <!-- ENCABEZADO -->

                    <div class="mb-5">


                        <p class="etiqueta mb-2">
                            ALBEDO OUTDOOR
                        </p>


                        <h1 class="fs-1">
                            Iniciar sesión
                        </h1>


                        <p class="text-secondary mt-3">
                            Ingresa tu correo y contraseña para
                            acceder a tu cuenta.
                        </p>


                    </div>



                    <!-- =================================
                         FORMULARIO
                         ================================= -->

                    <form
                        id="formularioLogin"
                        novalidate
                    >


                        <!-- CORREO -->

                        <div class="mb-4">


                            <label
                                for="correoLogin"
                                class="form-label fw-semibold"
                            >
                                Correo electrónico
                            </label>


                            <input
                                type="email"
                                class="form-control"
                                id="correoLogin"
                                name="correoLogin"
                                maxlength="100"
                                autocomplete="email"
                                placeholder="nombre@gmail.com"
                            >


                            <div id="feedbackCorreoLogin"></div>


                            <div class="form-text">

                                Correos permitidos:
                                @gmail.com,
                                @duoc.cl y
                                @profesor.duoc.cl

                            </div>


                        </div>



                        <!-- CONTRASEÑA -->

                        <div class="mb-4">


                            <label
                                for="contrasenaLogin"
                                class="form-label fw-semibold"
                            >
                                Contraseña
                            </label>


                            <input
                                type="password"
                                class="form-control"
                                id="contrasenaLogin"
                                name="contrasenaLogin"
                                maxlength="10"
                                autocomplete="current-password"
                                placeholder="Ingresa tu contraseña"
                            >


                            <div id="feedbackContrasenaLogin"></div>


                            <div class="form-text">
                                Debe tener entre 4 y 10 caracteres.
                            </div>


                        </div>



                        <!-- BOTÓN -->

                        <button
                            type="submit"
                            class="btn btn-dark px-4 py-2"
                        >
                            Iniciar sesión
                        </button>



                        <!-- RESULTADO DEL ENVÍO -->

                        <div
                            id="mensajeResultadoLogin"
                            role="alert"
                        ></div>


                    </form>


                </div>


            </div>


        </section>


    </main>



    <!-- =========================================
         PIE DE PÁGINA
         ========================================= -->

    <footer class="pie">


        <p class="pie-marca">
            ALBEDO OUTDOOR
        </p>


        <p>
            &copy; 2026 ALBEDO Outdoor.
        </p>


    </footer>



    <!-- BOOTSTRAP -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- JAVASCRIPT ALBEDO -->

    <script src="carrito.js"></script>

    <script src="login.js"></script>


</body>

</html>
