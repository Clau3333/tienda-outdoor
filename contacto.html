<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ALBEDO Outdoor | Contacto</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Estilos propios -->
    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <!-- CABECERA -->
    <header class="cabecera-tienda">

        <div class="cabecera-superior">

            <div class="espacio-cabecera"></div>

            <a
                class="marca"
                href="index.html"
                aria-label="ALBEDO Outdoor, inicio"
            >
                <img
                    src="img/logo-albedo.png"
                    alt="ALBEDO Outdoor"
                >
            </a>

            <nav
                class="enlaces-principales"
                aria-label="Navegación principal"
            >
                <a href="index.html">
                    Inicio
                </a>

                <a href="productos.html">
                    Productos
                </a>

                <a
                    href="contacto.html"
                    aria-current="page"
                >
                    Contacto
                </a>
            </nav>

        </div>

    </header>


    <!-- CONTENIDO -->
    <main>

        <section class="container py-5">

            <div class="row justify-content-center">

                <div class="col-12 col-lg-8 col-xl-7">

                    <!-- Encabezado -->

                    <div class="mb-5">

                        <p class="etiqueta mb-2">
                            ALBEDO OUTDOOR
                        </p>

                        <h1 class="fs-1">
                            Contáctanos
                        </h1>

                        <p class="text-secondary mt-3">
                            ¿Necesitas ayuda con un producto?
                            Envíanos tu consulta y nos pondremos
                            en contacto contigo.
                        </p>

                    </div>


                    <!-- FORMULARIO -->

                    <form id="formularioContacto">

                        <!-- Nombre -->

                        <div class="mb-4">

                            <label
                                for="nombre"
                                class="form-label fw-semibold"
                            >
                                Nombre
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="nombre"
                                name="nombre"
                                placeholder="Ingresa tu nombre"
                                required
                            >

                        </div>


                        <!-- Correo -->

                        <div class="mb-4">

                            <label
                                for="correo"
                                class="form-label fw-semibold"
                            >
                                Correo electrónico
                            </label>

                            <input
                                type="email"
                                class="form-control"
                                id="correo"
                                name="correo"
                                placeholder="nombre@correo.cl"
                                required
                            >

                        </div>


                        <!-- Teléfono -->

                        <div class="mb-4">

                            <label
                                for="telefono"
                                class="form-label fw-semibold"
                            >
                                Teléfono
                            </label>

                            <input
                                type="tel"
                                class="form-control"
                                id="telefono"
                                name="telefono"
                                placeholder="+56 9 1234 5678"
                                required
                            >

                        </div>


                        <!-- Motivo -->

                        <div class="mb-4">

                            <label
                                for="motivo"
                                class="form-label fw-semibold"
                            >
                                Motivo de contacto
                            </label>

                            <select
                                class="form-select"
                                id="motivo"
                                name="motivo"
                                required
                            >

                                <option value="" selected disabled>
                                    Selecciona una opción
                                </option>

                                <option value="producto">
                                    Consulta por producto
                                </option>

                                <option value="talla">
                                    Consulta por talla
                                </option>

                                <option value="pedido">
                                    Consulta por pedido
                                </option>

                                <option value="otro">
                                    Otro
                                </option>

                            </select>

                        </div>


                        <!-- Mensaje -->

                        <div class="mb-4">

                            <label
                                for="mensaje"
                                class="form-label fw-semibold"
                            >
                                Mensaje
                            </label>

                            <textarea
                                class="form-control"
                                id="mensaje"
                                name="mensaje"
                                rows="5"
                                placeholder="Escribe tu consulta..."
                                required
                            ></textarea>

                        </div>


                        <!-- Aceptación -->

                        <div class="form-check mb-4">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                id="terminos"
                                required
                            >

                            <label
                                class="form-check-label"
                                for="terminos"
                            >
                                Confirmo que los datos ingresados son correctos.
                            </label>

                        </div>


                        <!-- Botón -->

                        <button
                            type="submit"
                            class="btn btn-dark px-4 py-2"
                        >
                            Enviar consulta
                        </button>

                    </form>

                </div>

            </div>

        </section>

    </main>


    <!-- FOOTER -->

    <footer class="pie">

        <p class="pie-marca">
            ALBEDO OUTDOOR
        </p>

        <p>
            &copy; 2026 ALBEDO Outdoor.
        </p>

    </footer>


    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    ></script>

</body>

</html>
