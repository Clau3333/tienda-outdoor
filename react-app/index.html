<!doctype html>
<html lang="es" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/Sitio%20Old/img/logo-albedo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ALBEDO Outdoor | Inicio</title>
    <script>
      // Misma clave de visitante que getThemeStorageKey; evita un destello al recargar.
      try {
        const theme = localStorage.getItem('albedo:theme:guest') === 'dark' ? 'dark' : 'light';
        document.documentElement.dataset.bsTheme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch {
        document.documentElement.style.colorScheme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
