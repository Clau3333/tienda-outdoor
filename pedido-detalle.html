<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ALBEDO Outdoor | Detalle del pedido</title>


    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="estilos.css"
    >

</head>


<body>


    <!-- ==================================================
         CABECERA
         ================================================== -->

    <header class="cabecera-tienda">


        <div class="cabecera-superior">


            <div class="espacio-cabecera"></div>


            <a
                class="marca"
                href="index.html"
                aria-label="ALBEDO Outdoor, inicio"
            >

                <img
                    src="img/logo-albedo.png"
                    alt="ALBEDO Outdoor"
                >

            </a>


            <nav
                class="enlaces-principales"
                aria-label="Navegación principal"
            >

                <a href="index.html">
                    Inicio
                </a>

                <a href="productos.html">
                    Productos
                </a>

                <a href="nosotros.html">
                    Nosotros
                </a>

                <a href="blog.html">
                    Blog
                </a>

                <a href="contacto.html">
                    Contacto
                </a>

                <a href="carrito.html">

                    Carrito

                    <span
                        class="carrito-contador"
                        id="contadorCarrito"
                    >
                        0
                    </span>

                </a>

                <a href="login.html">
                    Iniciar sesión
                </a>

                <a href="registro.html">
                    Registrarse
                </a>

            </nav>


        </div>


    </header>



    <!-- ==================================================
         CONTENIDO
         ================================================== -->

    <main>


        <section class="container py-5">


            <div class="row justify-content-center">


                <div class="col-12 col-xl-10">


                    <!-- VOLVER -->

                    <a
                        href="mis-pedidos.html"
                        class="btn btn-outline-dark mb-4"
                    >
                        ← Volver a mis pedidos
                    </a>



                    <!-- CONTENEDOR DEL DETALLE -->

                    <div
                        id="detallePedidoCliente"
                    ></div>



                    <!-- ERROR -->

                    <div
                        id="pedidoNoDisponible"
                        class="alert alert-danger"
                        style="display: none;"
                        role="alert"
                    >

                        <h1 class="h5">
                            Pedido no disponible
                        </h1>

                        <p class="mb-3">
                            El pedido solicitado no existe
                            o no pertenece a tu cuenta.
                        </p>

                        <a
                            href="mis-pedidos.html"
                            class="btn btn-dark"
                        >
                            Volver a mis pedidos
                        </a>

                    </div>


                </div>


            </div>


        </section>


    </main>



    <!-- ==================================================
         FOOTER
         ================================================== -->

    <footer class="pie">

        <p class="pie-marca">
            ALBEDO OUTDOOR
        </p>

        <p>
            &copy; 2026 ALBEDO Outdoor.
        </p>

    </footer>



    <!-- ==================================================
         JAVASCRIPT
         ================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>

    <script src="carrito.js"></script>

    <script src="pedido-detalle.js"></script>

    <script src="sesion.js"></script>


</body>

</html>
